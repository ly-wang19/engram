[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engram-memory"
version = "0.1.0"
description = "Engram — an open-source, reproducible long-term memory engine for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL-LICENSE.md"]
authors = [{ name = "Engram contributors" }]
keywords = ["memory", "llm", "agents", "rag", "knowledge-graph", "long-term-memory", "bi-temporal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# CORE HAS ZERO HARD DEPENDENCIES — the offline demo + tests must run on a bare Python.
dependencies = []

[project.optional-dependencies]
# Real embedding/LLM/vector/graph backends slot in behind the same interfaces.
backends = ["lancedb>=0.6", "numpy>=1.24"]
lancedb = ["lancedb>=0.6"]
embeddings = ["sentence-transformers>=2.2"]  # local BGE embeddings (ENGRAM_EMBEDDER=bge-*; no API key)
llm = ["litellm>=1.40"]
# Serving / adoption layer (CLAUDE.md §6).
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2"]   # the multi-tenant HTTP API + console
mcp = ["mcp>=1.2", "httpx>=0.27"]                              # the MCP server (httpx for remote-proxy mode)
# One-shot install for running the hosted product: HTTP API + MCP + real embeddings + an LLM backend.
serve = ["engram-memory[server,mcp,embeddings,llm]"]
eval = ["numpy>=1.24"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4", "tomli>=2; python_version < '3.11'"]
all = ["engram-memory[server,mcp,embeddings,backends,llm,eval,dev]"]

[project.scripts]
engram-quickstart = "engram.quickstart:main"       # zero-setup installed demo
engram-mcp = "engram.mcp.__main__:main"            # run the MCP server
engram-import = "engram.connectors.__main__:main"  # import a chat/history export
engram-migrate-pickle = "engram.store.migrate:main" # migrate trusted legacy pickle snapshots
engram-agent-setup = "engram.agent_setup:main"     # print cross-agent memory config snippets
engram-agent-bootstrap = "engram.agent_setup:bootstrap_main" # install + verify common agent configs
engram-agent-doctor = "engram.agent_doctor:main"   # verify an agent's Python/MCP memory runtime

[project.urls]
Homepage = "https://github.com/ly-wang19/engram"
Repository = "https://github.com/ly-wang19/engram"
Documentation = "https://github.com/ly-wang19/engram#readme"
Issues = "https://github.com/ly-wang19/engram/issues"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
