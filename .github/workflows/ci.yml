name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,server,mcp]" build twine
      - run: pytest
      - run: python scripts/check_zero_setup.py
      - run: python scripts/check_release.py
      - if: matrix.python-version == '3.12'
        run: python -m build && python -m twine check dist/*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: npm --prefix clients/typescript ci
      - run: npm --prefix clients/typescript run typecheck
      - run: npm --prefix clients/typescript test
      - run: npm --prefix clients/typescript run build
      - run: npm install --global pnpm@10.30.3
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag engram-memory:ci .
